[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-smartsavant"
version = "0.1.1"
description = "A model-agnostic design council: stakeholder views and a juror merge per design-sprint phase, schema-checked adapter answers, exports (spec, stories, decision tree, trainset) and audits of council runs before anyone builds or trains from them."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SmartTasks Lab" }]
keywords = ["smart", "ai", "iaiso", "sf-smartsavant", "council", "design-sprint", "llm", "audit", "provenance"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://smarttasks.cloud"
Source = "https://github.com/SmartTasksOrg/sf-smartsavant"
Issues = "https://github.com/SmartTasksOrg/sf-smartsavant/issues"
Security = "https://github.com/SmartTasksOrg/sf-smartsavant/security/policy"
Changelog = "https://github.com/SmartTasksOrg/sf-smartsavant/blob/main/CHANGELOG.md"
Standard = "https://iaiso.org"

[project.scripts]
sf-smartsavant = "sf_smartsavant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sf_smartsavant = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
